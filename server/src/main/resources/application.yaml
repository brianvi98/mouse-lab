spring:
  application:
    name: mouselab

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  mvc:
    servlet:
      path: /api/v1

  jpa:
    show-sql: true

  flyway:
    enabled: false

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}