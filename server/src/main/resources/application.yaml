spring:
  application:
    name: mouselab

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  mvc:
    servlet:
      path: /api/v1

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://striking-goblin-49.clerk.accounts.dev

  flyway:
    enabled: false

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}