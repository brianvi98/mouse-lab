spring:
  application:
    name: mouselab

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  mvc:
    servlet:
      path: /api/v1

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CLERK_ISSUER_URI}

  flyway:
    enabled: true

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}